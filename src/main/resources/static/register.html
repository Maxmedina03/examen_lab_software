<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguros Argentum</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo-name">Seguros Argentum</div>
    </header>

    <div class="wrapper">
        <div class="login-container">
            <h2 style="color: #0047AB ;">Crear Cuenta</h2>
            <form id="form-cliente">
                <input type="text" name="nombre" placeholder="Nombre" required>
                <input type="text" name="apellido" placeholder="Apellido" required>
                <input type="text" name="dniCuit" placeholder="DNI o CUIT" required>
                <input type="tel" name="telefono" placeholder="Teléfono" required>
                <input type="text" name="direccion" placeholder="Dirección" required>
                <input type="email" name="email" placeholder="Correo electrónico" required>
                <input type="password" name="contraseña" placeholder="Contraseña" required>

                <button type="button" onclick="guardarCliente()">Registrarse</button>

               
            </form>
        </div>
    </div>

    <script>

        async function guardarCliente() {
            const form = document.getElementById('form-cliente');

            
            const formData = new FormData(form);
            const cliente = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([cliente]) 
                });

                if (response.ok) {
                    alert("Cliente registrado correctamente");
                    form.reset(); 
                    window.location.href = "clientes.html"
                } else {
                    alert("Error al guardar: " + response.statusText);
                }
            } catch (error) {
                console.error("Error de conexión:", error);
            }
        }
    </script>

</body>

</html>
